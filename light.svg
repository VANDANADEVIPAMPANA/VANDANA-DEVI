<radialGradient id="violetGlow"><stop stop-color="#7C3AED" stop-opacity=".14"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="round"><rect x="8" y="8" width="1164" height="594" rx="30"/></clipPath>
